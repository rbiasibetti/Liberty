name: Carga noturna

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-load
  cancel-in-progress: false

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: '2.3.0'
      - name: Construir o backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true -Djacoco.skip=true package
      - name: Banco SQL Server efêmero e migração do core
        run: |
          set -euo pipefail
          sa_password="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$sa_password"
          echo "SA_PASSWORD=$sa_password" >> "$GITHUB_ENV"
          docker run -d --name mssql -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$sa_password" \
            mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:190696778dca17a0862a3a5680068357cdd09dd0ced185b2ed918e4a0226695a
          for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null && break; sleep 2; done
          sleep 15
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$sa_password" -Q "CREATE DATABASE liberty_core"
          cd backend
          ./mvnw -B -ntp -q -pl liberty-core-migrations flyway:migrate \
            "-Dflyway.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=liberty_core;encrypt=true;trustServerCertificate=true" \
            -Dflyway.user=sa "-Dflyway.password=$sa_password"
      - name: Subir a aplicação
        env:
          LIBERTY_CORE_URL: jdbc:sqlserver://127.0.0.1:1433;databaseName=liberty_core;encrypt=true;trustServerCertificate=true
          LIBERTY_CORE_APP_USER: sa
          LIBERTY_CORE_APP_PASSWORD: ${{ env.SA_PASSWORD }}
        run: |
          java -jar backend/liberty-app/target/liberty-app.jar > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::A aplicação não ficou saudável em 2 minutos"; cat app.log; exit 1
      - name: Rodar os cenários de nightly.txt
        run: |
          set -euo pipefail
          mkdir -p k6-results
          status=0
          while read -r scenario; do
            case "$scenario" in ''|\#*|*' '*) continue ;; esac
            echo "::group::$scenario"
            k6 run --summary-export "k6-results/${scenario%.js}.json" "loadtest/scenarios/$scenario" || status=1
            echo "::endgroup::"
          done < loadtest/nightly.txt
          exit $status
      - name: Encerrar a aplicação
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k6-results
          path: |
            k6-results
            app.log
          if-no-files-found: ignore
          retention-days: 30
