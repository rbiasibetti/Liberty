name: Segurança das dependências

on:
  pull_request:
    paths:
      - 'backend/**/pom.xml'
      - 'backend/pom.xml'
      - 'frontend/package-lock.json'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owasp-dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Exigir a chave da API do NVD
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Configure o secret NVD_API_KEY (https://nvd.nist.gov/developers/request-an-api-key)."
            exit 1
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: depcheck-${{ github.run_id }}
          restore-keys: depcheck-
      - name: OWASP Dependency-Check (falha com CVSS 7 ou mais)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Psca verify -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true -Djacoco.skip=true
