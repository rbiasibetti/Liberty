spring:
  application:
    name: liberty
  datasource:
    # Banco central (liberty_core). Sem valores padrão para URL e senha: sem eles a aplicação não sobe.
    url: ${LIBERTY_CORE_URL}
    username: ${LIBERTY_CORE_APP_USER:liberty_core_app}
    password: ${LIBERTY_CORE_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      leak-detection-threshold: 20000
  flyway:
    enabled: false # a migração roda na esteira de deploy (liberty-core-migrations), não na subida
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  main:
    banner-mode: "off"
  jackson:
    deserialization:
      fail-on-unknown-properties: true

liberty:
  exports:
    # Pasta dos arquivos gerados (um volume dedicado e com backup em produção) e chave HMAC das URLs
    # assinadas de download (32 caracteres ou mais; igual em todas as instâncias)
    directory: ${LIBERTY_EXPORT_DIR:./data/exports}
    signing-key: ${LIBERTY_EXPORT_SIGNING_KEY:}
  limits:
    # Padrão do plano (docs/requisitos-nao-funcionais.md); planos maiores em liberty.limits.plans.<PLANO>
    rate-per-second: 50
    burst: 100
    max-concurrent: 20
    # Com Redis o limite de taxa soma todas as instâncias; sem ele vale por instância. Ex.: redis://:senha@host:6379
    redis-uri: ${LIBERTY_REDIS_URI:}
  metrics:
    # Conta técnica do /actuator/prometheus; sem senha o endpoint fica fechado
    username: metrics
    password: ${LIBERTY_METRICS_PASSWORD:}
  vault:
    # Cofre das senhas dos bancos dos tenants. Em produção: authentication=KUBERNETES; TOKEN só em desenvolvimento.
    uri: ${LIBERTY_VAULT_URI}
    mount: secret
    authentication: ${LIBERTY_VAULT_AUTH:TOKEN}
    token: ${LIBERTY_VAULT_TOKEN:}
    kubernetes-role: ${LIBERTY_VAULT_K8S_ROLE:liberty}
  tenancy:
    pool-idle-ttl: 30m
  security:
    issuer: ${LIBERTY_SECURITY_ISSUER} # URL pública desta API; vai no claim iss dos tokens de cliente
    audience: liberty-api
    token-ttl: 15m
    client-cache-ttl: 15s
    keys:
      store: ${LIBERTY_SECURITY_KEYS_STORE:VAULT} # MEMORY só em desenvolvimento e testes
      vault-path: liberty/jwt/keys
      rotation-period: 90d
      retirement-grace: 24h
    oidc:
      issuer: ${LIBERTY_OIDC_ISSUER} # provedor dos usuários da interface (Keycloak, Entra ID)
      client-id: liberty-frontend
      platform-admin-role: liberty-platform-admin
    allowed-origins: ${LIBERTY_ALLOWED_ORIGINS:}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    encoding:
      force: true

management:
  metrics:
    tags:
      application: liberty
  tracing:
    # Rastros distribuídos (OpenTelemetry): desligados por padrão; ligue com LIBERTY_TRACE_SAMPLING (0 a 1)
    sampling:
      probability: ${LIBERTY_TRACE_SAMPLING:0.0}
  opentelemetry:
    resource-attributes:
      service.name: liberty
    tracing:
      export:
        otlp:
          endpoint: ${LIBERTY_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
