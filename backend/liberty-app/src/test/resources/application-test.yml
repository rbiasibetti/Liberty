liberty:
  limits:
    # os testes disparam rajadas (fuzzing); o limite do plano é exercitado no NoisyNeighborTest
    rate-per-second: 100000
    burst: 100000
    max-concurrent: 1000
  metrics:
    password: teste-metricas
  queue:
    # os consumidores têm testes próprios; nos testes de contrato as mensagens ficam paradas e visíveis
    enabled: false
  vault:
    uri: http://127.0.0.1:8200
    token: teste
  security:
    issuer: http://liberty.test
    client-cache-ttl: 200ms
    keys:
      store: MEMORY
    oidc:
      issuer: http://127.0.0.1:1/realms/indisponivel
    allowed-origins: http://localhost:5173
  engine:
    routes-refresh-interval: 200ms
