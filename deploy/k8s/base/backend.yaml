apiVersion: apps/v1
kind: Deployment
metadata:
  name: liberty-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: liberty-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: liberty-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: liberty-backend
          image: ghcr.io/liberty/backend:latest
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: liberty-backend
spec:
  selector:
    app.kubernetes.io/name: liberty-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: liberty-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: liberty-backend
