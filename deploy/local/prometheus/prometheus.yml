global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: liberty-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: metrics
      password_file: /etc/prometheus/metrics_password
    static_configs:
      - targets: ["host.docker.internal:8080"]
